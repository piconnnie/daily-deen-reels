name: DEEN setup
description: Node, Python, ffmpeg, Remotion and Playwright for the Daily Deen Reminders content engine.
inputs:
  render:
    description: Install rendering toolchain (Remotion browser, Playwright Chromium, ffmpeg, Python audio libs)
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: actions/setup-python@v5
      if: inputs.render == 'true'
      with:
        python-version: '3.12'
    - name: System packages
      if: inputs.render == 'true'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
    - name: Python packages
      if: inputs.render == 'true'
      shell: bash
      run: pip install --quiet numpy scipy
    - name: npm install
      shell: bash
      working-directory: deen-content
      run: npm install --no-audit --no-fund
    - name: Cache verified source datasets
      uses: actions/cache@v4
      with:
        path: deen-content/.cache/sources
        key: deen-sources-${{ hashFiles('deen-content/sources/sources.json') }}
    - name: Fetch + hash-check verified sources (Qur'an, Bukhari, Muslim)
      shell: bash
      working-directory: deen-content
      run: node scripts/sources/cli.mjs fetch
    - name: Browsers
      if: inputs.render == 'true'
      shell: bash
      working-directory: deen-content
      run: |
        npx playwright install --with-deps chromium
        npx remotion browser ensure
